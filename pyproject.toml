[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-ai"
version = "0.1.0"
description = "Open-source AI toolkit for HVAC anomaly detection and fault detection and diagnosis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "xgboost>=2,<4",
    "lightgbm>=4,<5",
    "shap>=0.45,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
